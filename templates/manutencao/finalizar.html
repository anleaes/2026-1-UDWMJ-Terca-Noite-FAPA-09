{% extends 'base.html' %}
{% block title %}Finalizar Manutencao #{{ manutencao.id }}{% endblock %}
{% block body %}
<div class="ph"><div><div class="ph-title">Finalizar Manutencao #{{ manutencao.id }}</div><div class="ph-sub">{{ manutencao.veiculo }} — {{ manutencao.tipo_manutencao }}</div></div></div>
<div class="form-wrap"><form method="post">{% csrf_token %}{{ form.as_p }}
<div class="form-actions">
    <button type="submit" class="btn btn-success">Confirmar finalizacao</button>
    <a href="{% url 'manutencao_web:detalhe' manutencao.pk %}" class="btn btn-ghost">Cancelar</a>
</div></form></div>
{% endblock %}
