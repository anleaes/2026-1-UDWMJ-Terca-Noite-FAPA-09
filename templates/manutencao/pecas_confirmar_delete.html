{% extends 'base.html' %}
{% block title %}Excluir Peca{% endblock %}
{% block body %}
<div class="confirm-wrap">
    <h2>Excluir peca?</h2>
    <p><strong>{{ peca.tipo_peca }}</strong> — {{ peca.fabricante }}.</p>
    <form method="post" style="display:flex;gap:8px;">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar exclusao</button>
        <a href="{% url 'manutencao_web:pecas_lista' %}" class="btn btn-ghost">Cancelar</a>
    </form>
</div>
{% endblock %}
