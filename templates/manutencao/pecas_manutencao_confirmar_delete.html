{% extends 'base.html' %}
{% block title %}Remover Peca da Manutencao{% endblock %}
{% block body %}
<div class="confirm-wrap">
    <h2>Remover peca?</h2>
    <p>Remover <strong>{{ peca_manutencao.peca }}</strong> da manutencao {{ peca_manutencao.manutencao }}?</p>
    <form method="post" style="display:flex;gap:8px;">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar remocao</button>
        <a href="{% url 'manutencao_web:detalhe' peca_manutencao.manutencao.pk %}" class="btn btn-ghost">Cancelar</a>
    </form>
</div>
{% endblock %}
