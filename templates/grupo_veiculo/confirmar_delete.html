{% extends 'base.html' %}
{% block title %}Excluir Grupo{% endblock %}
{% block body %}
<div class="confirm-wrap">
    <h2>Excluir grupo?</h2>
    <p>Voce esta prestes a excluir o grupo <strong>{{ grupo.nome }}</strong>.</p>
    <form method="post" style="display:flex;gap:8px;">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar exclusao</button>
        <a href="{% url 'grupo_veiculo_web:lista' %}" class="btn btn-ghost">Cancelar</a>
    </form>
</div>
{% endblock %}
