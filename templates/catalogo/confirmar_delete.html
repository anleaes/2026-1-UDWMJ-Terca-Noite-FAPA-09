{% extends 'base.html' %}
{% block title %}Excluir do catalogo{% endblock %}
{% block body %}
<div class="confirm-wrap">
    <h2>Excluir item do catalogo?</h2>
    <p>Voce esta prestes a remover <strong>{{ catalogo.veiculo }}</strong>. Esta acao nao pode ser desfeita.</p>
    <form method="post" style="display:flex;gap:8px;">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar exclusao</button>
        <a href="{% url 'catalogo_web:lista' %}" class="btn btn-ghost">Cancelar</a>
    </form>
</div>
{% endblock %}
