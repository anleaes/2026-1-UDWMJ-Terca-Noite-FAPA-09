{% extends 'base.html' %}
{% block title %}{% if form.instance.pk %}Editar{% else %}Novo item{% endif %} — Catalogo{% endblock %}
{% block body %}
<div class="ph">
    <div><div class="ph-title">{% if form.instance.pk %}Editar item{% else %}Novo item no catalogo{% endif %}</div></div>
</div>
<div class="form-wrap">
<form method="post">{% csrf_token %}{{ form.as_p }}
<div class="form-actions">
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{% url 'catalogo_web:lista' %}" class="btn btn-ghost">Cancelar</a>
</div></form></div>
{% endblock %}
