{% extends 'base.html' %}
{% block title %}Excluir Local{% endblock %}
{% block body %}
<div class="confirm-wrap">
    <h2>Excluir local?</h2>
    <p>Voce esta prestes a excluir <strong>{{ local.nome }}</strong>.</p>
    <form method="post" style="display:flex;gap:8px;">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar exclusao</button>
        <a href="{% url 'locais:lista' %}" class="btn btn-ghost">Cancelar</a>
    </form>
</div>
{% endblock %}
