{% extends 'base.html' %}
{% block title %}Excluir Alocacao{% endblock %}
{% block body %}
<div class="confirm-wrap">
    <h2>Excluir alocacao?</h2>
    <p>Alocacao <strong>#{{ alocacao.id }}</strong>. Esta acao nao pode ser desfeita.</p>
    <form method="post" style="display:flex;gap:8px;">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar exclusao</button>
        <a href="{% url 'alocacao_web:lista' %}" class="btn btn-ghost">Cancelar</a>
    </form>
</div>
{% endblock %}
