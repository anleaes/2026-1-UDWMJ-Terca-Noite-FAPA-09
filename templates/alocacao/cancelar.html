{% extends 'base.html' %}
{% block title %}Cancelar Alocacao #{{ alocacao.id }}{% endblock %}
{% block body %}
<div class="confirm-wrap">
    <h2>Cancelar alocacao?</h2>
    <p>Alocacao <strong>#{{ alocacao.id }}</strong> — {{ alocacao.solicitacao }}.</p>
    <form method="post" style="flex-direction:column;gap:12px;display:flex">{% csrf_token %}
        {{ form.as_p }}
        <div style="display:flex;gap:8px">
            <button type="submit" class="btn btn-danger">Confirmar cancelamento</button>
            <a href="{% url 'alocacao_web:detalhe' alocacao.pk %}" class="btn btn-ghost">Voltar</a>
        </div>
    </form>
</div>
{% endblock %}
