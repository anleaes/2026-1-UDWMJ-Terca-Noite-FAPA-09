{% extends 'base.html' %}
{% block title %}Excluir Solicitacao{% endblock %}
{% block body %}
<div class="confirm-wrap">
    <h2>Excluir solicitacao?</h2>
    <p>Solicitacao <strong>#{{ solicitacao.id }}</strong> de {{ solicitacao.cliente }}. Esta acao nao pode ser desfeita.</p>
    <form method="post" style="display:flex;gap:8px;">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar exclusao</button>
        <a href="{% url 'solicitacoes:lista' %}" class="btn btn-ghost">Cancelar</a>
    </form>
</div>
{% endblock %}
